spring.application.name = bankapplication

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE

# base host for short URLs
app.base-url=http://localhost:8090
server.port=8090

management.security.enabled = false
management.port=9000

# Clean, safe database state alignment
spring.jpa.hibernate.ddl-auto=update

spring.boot.admin.client.url=http://localhost:9060
spring.boot.admin.client.enabled=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin

spring.security.user.name=client
spring.security.user.password=client
spring.boot.admin.client.instance.metadata.user.name=${spring.security.user.name}
spring.boot.admin.client.instance.metadata.user.password=${spring.security.user.password}

#spring.boot.admin.routes.endpoints=env, metrics, trace, jolokia, info, configprops

spring.datasource.url=jdbc:sqlserver://localhost:1433;instance=SQLEXPRESS;database=Bank;encrypt=true;trustServerCertificate=true;oginTimeout=30;
spring.datasource.username=sa
spring.datasource.password=K1ev2oo1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.dialect = org.hibernate.dialect.SQLServerDialect
spring.jpa.database = SQL_SERVER
spring.jpa.show-sql=true

#spring.jpa.hibernate.ddl-auto = create-drop
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# Naming strategy
#spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy

#Turn Statistics on
spring.jpa.properties.hibernate.generate_statistics=true

# Connect to your local KRaft broker
# Force IPv4 loopback instead of 'localhost'
spring.kafka.bootstrap-servers=127.0.0.1:9092

# Crucial Trust Package Configuration for JSON Security
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Map a shorthand token to your exact class path
spring.kafka.producer.properties.spring.json.type.mapping=userEvent:com.example.demo.UserEvent
spring.kafka.consumer.properties.spring.json.type.mapping=userEvent:com.example.demo.UserEvent

# Producer: Serialize Java objects to JSON strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: Deserialize JSON strings back to Java objects
spring.kafka.consumer.group-id=json-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="t0mk0us" password="K1ev2oo1";

# Stop a failed connection from crashing your app startup context
spring.kafka.admin.fail-fast=false

# Ensure the broker is listening on your local interface
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://127.0.0.1:9092

# logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.stat=debug
logging.level.org.hibernate.type=trace
logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.=error


